services:
  api:
    image: mayankfawkes/ip:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      GEOIP_PROVIDER: dbip
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      PROXY_HEADER: ${PROXY_HEADER:-X-Forwarded-For}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-300}
      RATELIMIT_ENABLE: ${RATELIMIT_ENABLE:-true}
    volumes:
      - databases:/data:ro
    read_only: true

  updater:
    image: mayankfawkes/ip:latest
    entrypoint: ["/usr/local/bin/updater"]
    restart: unless-stopped
    healthcheck:
      disable: true
    environment:
      GEOIP_PROVIDER: dbip
      UPDATE_INTERVAL: ${UPDATE_INTERVAL:-24h}
    volumes:
      - databases:/data

volumes:
  databases:
