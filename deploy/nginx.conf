# Install inside an existing TLS-enabled server block for ip.mynk.org.
# Configure certificates/TLS using your normal deployment tooling.
#
# This example is for Nginx running on the Docker HOST.
# Set TRUSTED_PROXIES to the exact peer IP the app sees from host Nginx;
# Docker port forwarding may make this the bridge gateway, not 127.0.0.1.
# Never use 0.0.0.0/0, ::/0, or all private networks as trusted proxies.
#
# Optional aggregate admission protection (tune for your traffic): add this at
# http{} scope, OUTSIDE the server block:
#   limit_req_zone $server_name zone=myip_global:1m rate=50r/s;
# Then uncomment limit_req and limit_req_status below. The aggregate budget
# matters: a routed IPv6 /48 can rotate /64s and fill the app's client table.
# Prevent direct-origin bypass and coordinate limits across multiple ingresses.
location / {
    # limit_req zone=myip_global burst=100 nodelay;
    # limit_req_status 429;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Overwrite, rather than append to, attacker-supplied forwarding headers.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_cache off;
    # Avoid storing raw visitor IPs in the web server's access log.
    access_log off;
    # Nginx error logs can still contain client IPs and request URLs. Configure
    # their access controls, retention and redaction in your logging policy.
}

# If Cloudflare is IN FRONT OF Nginx, configure ngx_http_realip_module:
#   real_ip_header CF-Connecting-IP;
#   real_ip_recursive on;
#   set_real_ip_from <each current Cloudflare IPv4/IPv6 CIDR>;
# Official ranges: https://www.cloudflare.com/ips/
# Then $remote_addr above is the validated visitor IP.
# Automate range updates with validation and nginx -t before reload.
