name: Publish release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  dockerhub:
    name: Docker Hub image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive metadata from tag
        id: metadata
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          printf 'version=%s\ndate=%s\n' "$GITHUB_REF_NAME" "$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<TAGS'
            echo "mayankfawkes/ip:$GITHUB_REF_NAME"
            if [[ "$GITHUB_REF_NAME" != *-* ]]; then echo 'mayankfawkes/ip:latest'; fi
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.date }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  github-release:
    name: Linux binaries and GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build standalone Linux API binaries
        run: BUILD_DATE="$(git show -s --format=%cI "$GITHUB_SHA")" sh scripts/release.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          args=(--verify-tag --title "$GITHUB_REF_NAME" --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" "${args[@]}"
          fi
          assets=("dist/SHA256SUMS-$GITHUB_REF_NAME.txt")
          for arch in amd64 arm64 armv7 386 riscv64; do
            assets+=("dist/myip-$GITHUB_REF_NAME-linux-$arch")
          done
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
